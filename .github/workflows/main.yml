name: CI - Compilar y Ejecutar Tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compilar
        run: mvn compile --no-transfer-progress -f inventario/pom.xml
      - name: Tests
        run: mvn test --no-transfer-progress -f inventario/pom.xml
